<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18181B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Minha Oficina</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#18181B}
a{color:#FFC107}a:hover{color:#FFD54F}
button{font:inherit;cursor:pointer}
input{font:inherit}
input::placeholder{color:#8A8A8A}
input:focus-visible,button:focus-visible,a:focus-visible,label:focus-within{outline:2px solid #FFC107;outline-offset:2px}
@keyframes dicaBrilho{0%,100%{box-shadow:0 0 0 0 rgba(255,193,7,0)}50%{box-shadow:0 0 0 2px rgba(255,193,7,0.35)}}
@keyframes dicaSeta{0%,100%{transform:translateY(-1px);opacity:0.6}50%{transform:translateY(3px);opacity:1}}
.dica-brilho{animation:dicaBrilho 2.4s ease-in-out infinite}
.dica-seta{animation:dicaSeta 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.dica-brilho,.dica-seta{animation:none}}
</style>
<style>
html, body { height: 100%; }
body { margin: 0; background: #18181B; }
#app { height: 100%; display: flex; justify-content: center; }
#app > div { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
</style>
</head>
<body>
<div id="app"></div>
<template id="tela"><div style="width: 100%; max-width: 560px; height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; background: #18181B; color: #FFFFFF; font-family: 'Poppins', system-ui, sans-serif; font-size: 14px; overflow: hidden">

  <!-- CABEÇALHO DO INÍCIO -->
  <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
    <header style="flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 18px 16px 8px">
      <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
        <span style="font-size: 12px; color: #A1A1AA">{{saudacaoHora}}</span>
        <span style="font-weight: 700; font-size: 24px; line-height: 1.15">Orçar</span>
      </div>
      <sc-if value="{{hasLowStock}}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{navStockBaixo}}" style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; border: 0; background: #3B1414; color: #F87171; font-size: 12px; font-weight: 600; flex-shrink: 0">{{lowCount}} repor</button>
      </sc-if>
      <div style="width: 40px; height: 40px; border-radius: 50%; background: #3F3F46; border: 1px solid #FFC107; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0">{{mecIniciais}}</div>
    </header>
  </sc-if>

  <!-- CABEÇALHO DAS OUTRAS TELAS -->
  <sc-if value="{{notHome}}" hint-placeholder-val="{{ false }}">
    <header style="flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 14px 16px 10px">
      <sc-if value="{{showBack}}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{goBack}}" aria-label="Voltar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: #FFFFFF; margin-left: -10px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
        </button>
      </sc-if>
      <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
        <span style="font-weight: 600; font-size: 20px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{headerTitle}}</span>
        <span style="font-size: 12px; color: #A1A1AA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{headerSub}}</span>
      </div>
      <sc-if value="{{isStock}}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{bellStock}}" aria-label="{{bellLabel}}" style="position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #27272A; border: 1px solid #3F3F46; border-radius: 50%; color: #FFFFFF">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
          <sc-if value="{{hasLowStock}}" hint-placeholder-val="{{ true }}">
            <span style="position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #EF4444; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{lowCount}}</span>
          </sc-if>
        </button>
        <div style="width: 40px; height: 40px; margin-left: 6px; border-radius: 50%; background: #3F3F46; border: 1px solid #FFC107; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0">{{mecIniciais}}</div>
      </sc-if>
    </header>
  </sc-if>

  <sc-if value="{{inFlow}}" hint-placeholder-val="{{ false }}">
    <ol aria-label="Passos do orçamento" style="flex-shrink: 0; display: flex; gap: 6px; margin: 0; padding: 0 16px 12px; list-style: none">
      <sc-for list="{{steps}}" as="st" hint-placeholder-count="4">
        <li style="flex: 1; display: flex; flex-direction: column; gap: 5px">
          <span style="{{st.bar}}"></span>
          <span style="{{st.labelStyle}}">{{st.label}}</span>
        </li>
      </sc-for>
    </ol>
  </sc-if>

  <main style="flex: 1; overflow-y: auto; padding: 6px 16px 24px; position: relative">

    <sc-if value="{{hasFlash}}" hint-placeholder-val="{{ false }}">
      <div role="status" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin-bottom: 14px; background: #0F2E1C; border: 1px solid #22C55E; border-radius: 12px; font-size: 13px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M5 12l5 5 9-10"></path></svg>
        <span>{{flash}}</span>
      </div>
    </sc-if>

    <!-- INÍCIO: NOVO ORÇAMENTO -->
    <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <h2 style="margin: 0; font-weight: 600; font-size: 16px; color: #FFC107">Novo orçamento</h2>
        <section style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #27272A; border-radius: 16px">
          <label for="buscaPlaca" style="font-weight: 600; font-size: 15px">Placa da moto</label>
          <div style="display: flex; flex-direction: column; border-radius: 10px; overflow: hidden; border: 2px solid #3F3F46; background: #FFFFFF">
            <span aria-hidden="true" style="height: 16px; background: #1D4ED8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 600; letter-spacing: 0.2em">BRASIL</span>
            <input id="buscaPlaca" type="text" autocomplete="off" autocapitalize="characters" maxlength="8" placeholder="ABC1D23" value="{{placaBusca}}" onChange="{{setPlacaBusca}}" class="dica-brilho" style="height: 54px; border: 0; background: transparent; color: #18181B; text-align: center; font-family: 'Roboto Mono', ui-monospace, monospace; font-weight: 700; font-size: 30px; letter-spacing: 0.12em; text-transform: uppercase; outline: none">
          </div>
          <span style="font-size: 12px; color: #A1A1AA">Se a moto já veio antes, o app preenche tudo sozinho.</span>

          <sc-if value="{{placaAchada}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; background: #0F2E1C; border: 1.5px solid #22C55E; border-radius: 12px">
              <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #4ADE80">MOTO JÁ ATENDIDA · {{placaInfo.visitas}}</span>
              <span style="font-weight: 600; font-size: 16px">{{placaInfo.moto}}</span>
              <span style="font-size: 13px; color: #CFCFCF">{{placaInfo.cliente}}</span>
              <sc-for list="{{placaInfo.ultimas}}" as="u" hint-placeholder-count="2">
                <div style="display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: #A1A1AA">
                  <span>{{u.data}} · {{u.rev}}</span><span style="color: #FFFFFF; white-space: nowrap">{{u.total}}</span>
                </div>
              </sc-for>
              <button type="button" onClick="{{usarMoto}}" style="margin-top: 4px; height: 48px; border-radius: 12px; border: 0; background: #22C55E; color: #052E12; font-weight: 700; font-size: 15px">Usar esta moto e cliente</button>
            </div>
          </sc-if>
          <sc-if value="{{placaNova}}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 13px; color: #FFC107">Placa nova. Escolha a marca e o modelo abaixo; a placa já vai preenchida no orçamento.</span>
          </sc-if>
        </section>

        <p style="margin: 0; color: #CFCFCF; font-size: 13px">Ou escolha a marca:</p>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{brands}}" as="b" hint-placeholder-count="2">
            <button type="button" onClick="{{b.pick}}" style="display: flex; align-items: center; gap: 10px; height: 72px; padding: 0 12px; background: #27272A; border: 1px solid #3F3F46; border-radius: 16px; color: #FFFFFF; text-align: left">
              <img src="{{b.logo}}" alt="" style="width: 44px; height: 44px; object-fit: contain; flex-shrink: 0; display: block">
              <span style="display: flex; flex-direction: column; min-width: 0">
                <span style="font-weight: 700; font-size: 16px; letter-spacing: 0.04em; text-transform: uppercase">{{b.name}}</span>
                <span style="font-size: 11px; color: #A1A1AA">{{b.count}} modelos</span>
              </span>
            </button>
          </sc-for>
        </div>

        <!-- ORDENS EM ABERTO -->
        <section style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <h2 style="margin: 0; font-weight: 600; font-size: 16px">Em aberto</h2>
            <span style="font-size: 12px; color: #A1A1AA">{{abertasTxt}}</span>
          </div>
          <div style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px">
            <sc-for list="{{filtrosAbertas}}" as="f" hint-placeholder-count="5">
              <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.selected}}" style="{{f.style}}">{{f.label}}</button>
            </sc-for>
          </div>
          <sc-if value="{{semAbertas}}" hint-placeholder-val="{{ false }}">
            <span style="padding: 18px; background: #27272A; border-radius: 12px; color: #A1A1AA; text-align: center; font-size: 13px">Nenhuma ordem em aberto aqui.</span>
          </sc-if>
          <sc-for list="{{abertas}}" as="h" hint-placeholder-count="3">
            <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #27272A; border: 1px solid #3F3F46; border-radius: 14px">
              <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
                <span style="display: flex; align-items: baseline; gap: 8px; min-width: 0">
                  <span style="font-size: 12px; color: #A1A1AA">OS {{h.num}}</span>
                  <span style="font-weight: 600; font-size: 15px; letter-spacing: 0.06em">{{h.placa}}</span>
                </span>
                <span style="{{h.statusStyle}}">{{h.status}}</span>
              </div>
              <span style="font-size: 14px">{{h.cliente}} · {{h.moto}}</span>
              <div style="display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: #A1A1AA">
                <span>{{h.rev}} · {{h.data}}</span>
                <span style="font-weight: 700; color: #FFFFFF; font-size: 15px; white-space: nowrap">{{h.totalFmt}}</span>
              </div>
              <span style="font-size: 12px; color: #A1A1AA">{{h.telTxt}}</span>
              <div role="group" aria-label="Mudar a etapa" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
                <sc-for list="{{h.steps}}" as="st" hint-placeholder-count="5">
                  <button type="button" onClick="{{st.pick}}" aria-pressed="{{st.atual}}" aria-label="{{st.aria}}" style="{{st.style}}">{{st.label}}</button>
                </sc-for>
              </div>
              <div style="display: flex; gap: 8px">
                <sc-if value="{{h.hasNext}}" hint-placeholder-val="{{ true }}">
                  <button type="button" onClick="{{h.advance}}" style="flex: 1; height: 44px; background: #FFC107; border: 0; border-radius: 10px; color: #18181B; font-weight: 700; font-size: 14px">{{h.nextLabel}}</button>
                </sc-if>
                <sc-if value="{{h.hasWa}}" hint-placeholder-val="{{ false }}">
                  <button type="button" onClick="{{h.wa}}" style="flex: 1; height: 44px; padding: 0 10px; background: transparent; border: 1.5px solid #22C55E; border-radius: 10px; color: #4ADE80; font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.3-3.9A8.5 8.5 0 1 1 8 19z"></path></svg>{{h.waLabel}}</button>
                </sc-if>
              </div>
            <sc-if value="{{h.mostraAcoes}}" hint-placeholder-val="{{ true }}">
                <div style="display: flex; gap: 8px">
                  <button type="button" onClick="{{h.editar}}" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #52525B; background: transparent; color: #FFFFFF; font-size: 12px; font-weight: 500">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>Editar cliente
                  </button>
                  <button type="button" onClick="{{h.pedirApagar}}" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #7F1D1D; background: transparent; color: #F87171; font-size: 12px; font-weight: 500">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>Apagar
                  </button>
                </div>
              </sc-if>
              <sc-if value="{{h.apagando}}" hint-placeholder-val="{{ false }}">
                <div role="alertdialog" aria-label="Confirmar exclusão" style="display: flex; flex-direction: column; gap: 10px; padding: 12px; background: #2A1414; border: 1.5px solid #EF4444; border-radius: 12px">
                  <span style="font-weight: 600; font-size: 14px">Apagar a OS {{h.num}}?</span>
                  <span style="font-size: 12px; color: #FCA5A5">O orçamento de {{h.cliente}} ({{h.moto}}) some do app e não dá para recuperar.</span>
                  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
                    <button type="button" onClick="{{h.cancelarApagar}}" style="height: 44px; border-radius: 10px; border: 1px solid #52525B; background: transparent; color: #FFFFFF; font-weight: 500">Cancelar</button>
                    <button type="button" onClick="{{h.apagar}}" style="height: 44px; border-radius: 10px; border: 0; background: #EF4444; color: #FFFFFF; font-weight: 700">Apagar</button>
                  </div>
                </div>
              </sc-if>
              <sc-if value="{{h.editando}}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; background: #18181B; border: 1.5px solid #FFC107; border-radius: 12px">
                  <div style="display: flex; flex-direction: column; gap: 4px">
                    <label for="ecNome" style="font-size: 12px; color: #A1A1AA">Nome</label>
                    <input id="ecNome" type="text" value="{{edCli.cliente}}" onChange="{{edNome}}" placeholder="Nome do cliente" style="height: 44px; padding: 0 12px; background: #3F3F46; border: 1px solid #52525B; border-radius: 10px; color: #FFFFFF; min-width: 0">
                  </div>
                  <div style="display: flex; flex-direction: column; gap: 4px">
                    <label for="ecTel" style="font-size: 12px; color: #A1A1AA">WhatsApp do cliente</label>
                    <input id="ecTel" type="tel" inputMode="tel" value="{{edCli.tel}}" onChange="{{edTel}}" placeholder="(00) 00000-0000" style="height: 44px; padding: 0 12px; background: #3F3F46; border: 1px solid #52525B; border-radius: 10px; color: #FFFFFF; min-width: 0">
                  </div>
                  <div style="display: flex; flex-direction: column; gap: 4px">
                    <label for="ecPlaca" style="font-size: 12px; color: #A1A1AA">Placa</label>
                    <input id="ecPlaca" type="text" value="{{edCli.placa}}" onChange="{{edPlaca}}" placeholder="ABC1D23" style="height: 44px; padding: 0 12px; background: #3F3F46; border: 1px solid #52525B; border-radius: 10px; color: #FFFFFF; min-width: 0; text-transform: uppercase">
                  </div>
                  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
                    <button type="button" onClick="{{edCancelar}}" style="height: 44px; border-radius: 10px; border: 1px solid #52525B; background: transparent; color: #FFFFFF; font-weight: 500">Cancelar</button>
                    <button type="button" onClick="{{edSalvar}}" style="height: 44px; border-radius: 10px; border: 0; background: #FFC107; color: #18181B; font-weight: 700">Salvar</button>
                  </div>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </section>

        <!-- HISTÓRICO -->
        <section style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <h2 style="margin: 0; font-weight: 600; font-size: 16px">Histórico · pagos</h2>
            <span style="font-size: 12px; color: #A1A1AA">{{pagasTxt}}</span>
          </div>
          <sc-if value="{{semPagas}}" hint-placeholder-val="{{ false }}">
            <span style="padding: 14px; background: #27272A; border-radius: 12px; color: #A1A1AA; text-align: center; font-size: 13px">Os orçamentos pagos aparecem aqui.</span>
          </sc-if>
          <sc-for list="{{pagas}}" as="h" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #1F1F23; border: 1px solid #3F3F46; border-radius: 12px">
              <span style="width: 28px; height: 28px; border-radius: 50%; background: #0F2E1C; color: #4ADE80; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
              <span style="display: flex; flex-direction: column; flex: 1; min-width: 0">
                <span style="font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{h.moto}} · {{h.cliente}}</span>
                <span style="font-size: 11px; color: #A1A1AA">OS {{h.num}} · {{h.data}} · {{h.rev}}</span>
              </span>
              <span style="font-weight: 600; font-size: 13px; white-space: nowrap">{{h.totalFmt}}</span>
              <button type="button" onClick="{{h.reabrir}}" aria-label="Reabrir esta ordem" style="height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid #52525B; background: transparent; color: #CFCFCF; font-size: 11px">Reabrir</button>
            </div>
          </sc-for>
          <sc-if value="{{temMaisPagas}}" hint-placeholder-val="{{ false }}">
            <button type="button" onClick="{{verTodasPagas}}" style="height: 40px; border-radius: 10px; border: 1px solid #52525B; background: transparent; color: #FFFFFF; font-size: 13px">{{verPagasTxt}}</button>
          </sc-if>
        </section>
      </div>
    </sc-if>

    <!-- MODELOS DA MARCA -->
    <sc-if value="{{isModels}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{models}}" as="m" hint-placeholder-count="10">
          <div style="{{m.cardStyle}}">
            <button type="button" onClick="{{m.pick}}" aria-expanded="{{m.expanded}}" style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px; background: transparent; border: 0; color: #FFFFFF; text-align: left">
              <span style="width: 76px; height: 56px; border-radius: 10px; background: #3F3F46; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0 4px; box-sizing: border-box; color: #FFC107; font-weight: 700; font-size: 14px; letter-spacing: 0.02em; text-align: center; line-height: 1.1">{{m.apelido}}</span>
              <span style="display: flex; flex-direction: column; flex: 1; min-width: 0">
                <span style="font-weight: 600; font-size: 15px">{{m.name}}</span>
                <span style="font-size: 12px; color: #A1A1AA">{{m.kind}} · {{m.faixa}}{{m.anosTxt}}</span>
              </span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{m.chevStyle}}"><path d="M9 6l6 6-6 6"></path></svg>
            </button>
            <sc-if value="{{m.open}}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 12px 14px">
                <span style="font-size: 12px; color: #A1A1AA">Qual o ano da moto?</span>
                <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
                  <sc-for list="{{m.anos}}" as="a" hint-placeholder-count="11">
                    <button type="button" onClick="{{a.pick}}" style="height: 44px; border-radius: 10px; border: 1px solid #52525B; background: #18181B; color: #FFFFFF; font-weight: 600; font-size: 14px">{{a.ano}}</button>
                  </sc-for>
                </div>
              </div>
            </sc-if>

              <button type="button" onClick="{{fecharNovoCli}}" style="height: 44px; border-radius: 10px; border: 1px solid #52525B; background: transparent; color: #FFFFFF; font-weight: 500">Cancelar</button>

        <span style="font-size: 12px; color: #A1A1AA">{{clientesTxt}}</span>
        <sc-if value="{{semClientes}}" hint-placeholder-val="{{ false }}">
          <span style="padding: 18px; background: #27272A; border-radius: 12px; color: #A1A1AA; text-align: center; font-size: 13px">Nenhum cliente encontrado.</span>
        </sc-if>
        <sc-for list="{{clientesLista}}" as="c" hint-placeholder-count="4">
          <button type="button" onClick="{{c.abrir}}" style="display: flex; align-items: center; gap: 12px; padding: 12px; background: #27272A; border: 1px solid #3F3F46; border-radius: 14px; color: #FFFFFF; text-align: left">
            <span style="width: 44px; height: 44px; border-radius: 50%; background: #3F3F46; color: #FFC107; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0">{{c.iniciais}}</span>
            <span style="display: flex; flex-direction: column; flex: 1; min-width: 0">
              <span style="font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.nome}}</span>
              <span style="font-size: 12px; color: #A1A1AA">{{c.tel}}</span>
              <span style="font-size: 12px; color: #CFCFCF">{{c.resumo}}</span>
            </span>
            <sc-if value="{{c.temAbertas}}" hint-placeholder-val="{{ false }}"><span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #FFC107; color: #18181B; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{c.abertas}}</span></sc-if>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
          </button>
        </sc-for>
      </div>
    </sc-if>

    <!-- FICHA DO CLIENTE -->
    <sc-if value="{{isCliente}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <sc-if value="{{cliNaoEditando}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px; background: #27272A; border-radius: 16px; text-align: center">
            <span style="width: 64px; height: 64px; border-radius: 50%; background: #3F3F46; color: #FFC107; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 22px">{{ficha.iniciais}}</span>
            <span style="font-weight: 700; font-size: 20px">{{ficha.nome}}</span>
            <span style="font-size: 13px; color: #A1A1AA">{{ficha.tel}}</span>
            <span style="font-size: 12px; color: #CFCFCF">{{ficha.placas}}</span>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; width: 100%; margin-top: 6px">
              <button type="button" onClick="{{ficha.orcar}}" style="height: 46px; border-radius: 12px; border: 0; background: #FFC107; color: #18181B; font-weight: 700; font-size: 14px">Novo orçamento</button>
              <button type="button" onClick="{{ficha.wa}}" style="height: 46px; border-radius: 12px; border: 1.5px solid #22C55E; background: transparent; color: #4ADE80; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.3-3.9A8.5 8.5 0 1 1 8 19z"></path></svg>WhatsApp</button>
            </div>
            <div style="display: flex; gap: 8px">
              <button type="button" onClick="{{ficha.editar}}" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #52525B; background: transparent; color: #FFFFFF; font-size: 12px">Editar contato</button>
              <button type="button" onClick="{{ficha.pedirExcluir}}" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #7F1D1D; background: transparent; color: #F87171; font-size: 12px">Excluir contato</button>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{cliEditando}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #18181B; border: 1.5px solid #FFC107; border-radius: 14px">
            <div style="display: flex; flex-direction: column; gap: 4px">
              <label for="ecfNome" style="font-size: 12px; color: #A1A1AA">Nome</label>
              <input id="ecfNome" type="text" value="{{cliDraft.nome}}" onChange="{{cdNome}}" style="height: 44px; padding: 0 12px; background: #3F3F46; border: 1px solid #52525B; border-radius: 10px; color: #FFFFFF; min-width: 0">
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px">
              <label for="ecfTel" style="font-size: 12px; color: #A1A1AA">WhatsApp</label>
              <input id="ecfTel" type="tel" inputMode="tel" value="{{cliDraft.tel}}" onChange="{{cdTel}}" style="height: 44px; padding: 0 12px; background: #3F3F46; border: 1px solid #52525B; border-radius: 10px; color: #FFFFFF; min-width: 0">
            </div>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
              <button type="button" onClick="{{cdCancelar}}" style="height: 44px; border-radius: 10px; border: 1px solid #52525B; background: transparent; color: #FFFFFF; font-weight: 500">Cancelar</button>
              <button type="button" onClick="{{cdSalvar}}" style="height: 44px; border-radius: 10px; border: 0; background: #FFC107; color: #18181B; font-weight: 700">Salvar</button>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{cliExcluindo}}" hint-placeholder-val="{{ false }}">
          <div role="alertdialog" aria-label="Confirmar exclusão do contato" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #2A1414; border: 1.5px solid #EF4444; border-radius: 14px">
            <span style="font-weight: 600">Excluir {{ficha.nome}} dos contatos?</span>
            <span style="font-size: 12px; color: #FCA5A5">Os orçamentos dele continuam no app, só o contato sai da lista.</span>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
              <button type="button" onClick="{{ficha.cancelarExcluir}}" style="height: 44px; border-radius: 10px; border: 1px solid #52525B; background: transparent; color: #FFFFFF">Cancelar</button>
              <button type="button" onClick="{{ficha.excluir}}" style="height: 44px; border-radius: 10px; border: 0; background: #EF4444; color: #FFFFFF; font-weight: 700">Excluir</button>
            </div>
          </div>
        </sc-if>

        <section style="display: flex; flex-direction: column; gap: 8px">
          <h2 style="margin: 0; font-weight: 600; font-size: 15px">Em aberto · {{ficha.nAbertas}}</h2>
          <sc-if value="{{ficha.semAbertas}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: #A1A1AA">Nada em aberto.</span></sc-if>
          <sc-for list="{{ficha.abertas}}" as="o" hint-placeholder-count="1">
            <div style="display: flex; align-items: center; gap: 10px; padding: 12px; background: #27272A; border-radius: 12px">
              <span style="display: flex; flex-direction: column; flex: 1; min-width: 0">
                <span style="font-size: 14px; font-weight: 500">{{o.moto}}</span>
                <span style="font-size: 12px; color: #A1A1AA">OS {{o.num}} · {{o.data}} · {{o.rev}}</span>
              </span>
              <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
                <span style="{{o.statusStyle}}">{{o.status}}</span>
                <span style="font-weight: 600; font-size: 13px">{{o.totalFmt}}</span>
              </span>
            </div>
          </sc-for>
        </section>
        <section style="display: flex; flex-direction: column; gap: 8px">
          <h2 style="margin: 0; font-weight: 600; font-size: 15px">Concluídos · {{ficha.nPagas}}</h2>
          <sc-if value="{{ficha.semPagas}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: #A1A1AA">Nenhum serviço pago ainda.</span></sc-if>
          <sc-for list="{{ficha.pagas}}" as="o" hint-placeholder-count="1">
            <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #1F1F23; border: 1px solid #3F3F46; border-radius: 12px">
              <span style="display: flex; flex-direction: column; flex: 1; min-width: 0">
                <span style="font-size: 13px">{{o.moto}}</span>
                <span style="font-size: 11px; color: #A1A1AA">OS {{o.num}} · {{o.data}} · {{o.rev}}</span>
              </span>
              <span style="font-weight: 600; font-size: 13px">{{o.totalFmt}}</span>
            </div>
          </sc-for>
        </section>
      </div>
    </sc-if>

    <!-- ESTOQUE -->
    <sc-if value="{{isStock}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; background: #27272A; border: 1px solid #3F3F46; border-radius: 12px">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFC107" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg>
            <span style="font-weight: 600; font-size: 20px; line-height: 1.1">{{stockUnits}}</span>
            <span style="font-size: 11px; color: #A1A1AA; line-height: 1.3">Peças em estoque</span>
          </div>
          <button type="button" onClick="{{toggleLow}}" aria-pressed="{{lowPressed}}" style="{{lowCardStyle}}">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l10 18H2z" fill="#EF4444"></path><path d="M12 10v5M12 18v.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path></svg>
            <span style="font-weight: 600; font-size: 20px; line-height: 1.1">{{lowCount}}</span>
            <span style="font-size: 11px; color: #CFCFCF; line-height: 1.3">Abaixo do mínimo</span>
          </button>
          <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; background: #27272A; border: 1px solid #3F3F46; border-radius: 12px; min-width: 0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle></svg>
            <span style="font-weight: 600; font-size: 15px; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{stockValueFmt}}</span>
            <span style="font-size: 11px; color: #A1A1AA; line-height: 1.3">Valor em estoque</span>
          </div>
        </div>

        <div style="display: flex; gap: 8px">
          <label style="flex: 1; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; background: #27272A; border: 1px solid #3F3F46; border-radius: 12px; color: #A1A1AA; min-width: 0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
            <input type="search" aria-label="Buscar peça" placeholder="Buscar peça pelo nome..." value="{{stockBusca}}" onChange="{{setStockBusca}}" style="flex: 1; min-width: 0; height: 44px; background: transparent; border: 0; color: #FFFFFF; outline: none">
          </label>
          <button type="button" onClick="{{addStock}}" aria-label="Cadastrar peça" style="width: 46px; height: 46px; flex-shrink: 0; background: #FFC107; border: 0; border-radius: 12px; color: #27272A; display: flex; align-items: center; justify-content: center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </div>

        <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px">
          <sc-for list="{{catFilters}}" as="f" hint-placeholder-count="6">
            <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.selected}}" style="{{f.style}}">{{f.label}}</button>
          </sc-for>
        </div>

        <sc-if value="{{stockEmpty}}" hint-placeholder-val="{{ false }}">
          <span style="padding: 18px; background: #27272A; border-radius: 12px; color: #A1A1AA; text-align: center; font-size: 13px">Nenhuma peça encontrada.</span>
        </sc-if>

        <sc-for list="{{stock}}" as="sk" hint-placeholder-count="5">
          <div style="display: flex; gap: 12px; padding: 12px; background: #27272A; border: 1px solid #3F3F46; border-radius: 14px">
            <div style="width: 56px; height: 56px; border-radius: 12px; background: #3F3F46; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #FFC107">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0">
              <div style="display: flex; align-items: flex-start; gap: 6px">
                <span style="display: flex; flex-direction: column; flex: 1; min-width: 0">
                  <input type="text" value="{{sk.name}}" onChange="{{sk.setName}}" aria-label="Nome da peça" style="width: 100%; box-sizing: border-box; height: 24px; padding: 0; background: transparent; border: 0; color: #FFFFFF; font-size: 14px; font-weight: 600">
                  <span style="font-size: 12px; color: #A1A1AA">{{sk.cat}} · Em estoque: <span style="color: #FFFFFF; font-weight: 600">{{sk.qty}} un.</span></span>
                </span>
                <sc-if value="{{sk.isRed}}" hint-placeholder-val="{{ false }}">
                  <span style="font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: #3B1414; color: #F87171; white-space: nowrap">Repor</span>
                </sc-if>
              </div>
              <div style="height: 6px; border-radius: 3px; background: #3F3F46; overflow: hidden" aria-hidden="true"><span style="{{sk.barStyle}}"></span></div>
              <div style="display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 11px; color: #A1A1AA">
                <label style="display: flex; align-items: center; gap: 2px">
                  Mín.
                  <input type="text" inputMode="numeric" value="{{sk.min}}" onChange="{{sk.setMin}}" aria-label="Quantidade mínima" style="width: 24px; background: transparent; border: 0; border-bottom: 1px dashed #5A5A5A; color: #FFFFFF; font-size: 11px; padding: 0; text-align: center">
                </label>
                <label style="display: flex; align-items: center; gap: 2px">
                  Custo R$
                  <input type="text" inputMode="decimal" value="{{sk.custo}}" onChange="{{sk.setCusto}}" aria-label="Preço de custo por unidade" placeholder="—" style="width: 38px; background: transparent; border: 0; border-bottom: 1px dashed #5A5A5A; color: #FFFFFF; font-size: 11px; padding: 0; text-align: center">
                  /un.
                </label>
              </div>
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
                <span style="{{sk.pillStyle}}">{{sk.levelLabel}}</span>
                <span style="display: flex; align-items: center; border: 1px solid #52525B; border-radius: 10px; overflow: hidden">
                  <button type="button" onClick="{{sk.dec}}" aria-label="Diminuir quantidade" style="width: 44px; height: 38px; background: transparent; border: 0; color: #FFFFFF; font-size: 18px">−</button>
                  <span style="width: 1px; height: 22px; background: #52525B"></span>
                  <button type="button" onClick="{{sk.inc}}" aria-label="Aumentar quantidade" style="width: 44px; height: 38px; background: transparent; border: 0; color: #FFC107; font-size: 18px">+</button>
                </span>
              </div>
            </div>
          </div>
        </sc-for>
        <span style="font-size: 11px; color: #8A8A8A; text-align: center">Quantidades e custos de exemplo. A baixa é automática quando um serviço começa.</span>
      </div>
    </sc-if>

    <!-- AJUSTES -->
    <sc-if value="{{isSettings}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <section style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #27272A; border-radius: 12px">
          <h2 style="margin: 0; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #A1A1AA; font-weight: 500">Sua oficina (vai no orçamento)</h2>
          <div style="display: flex; align-items: center; gap: 12px">
            <sc-if value="{{hasLogo}}" hint-placeholder-val="{{ false }}"><img src="{{shopLogo}}" alt="Logo da oficina" style="width: 60px; height: 60px; object-fit: contain; background: #FFFFFF; border-radius: 12px; flex-shrink: 0"></sc-if>
            <sc-if value="{{noLogo}}" hint-placeholder-val="{{ true }}"><div style="width: 60px; height: 60px; border-radius: 12px; border: 1.5px dashed #FFC107; display: flex; align-items: center; justify-content: center; color: #FFC107; font-size: 11px; flex-shrink: 0">LOGO</div></sc-if>
            <label style="position: relative; height: 44px; padding: 0 16px; display: flex; align-items: center; border: 1.5px solid #FFC107; border-radius: 10px; color: #FFC107; font-weight: 500; cursor: pointer">
              {{logoLabel}}
              <input type="file" accept="image/png,image/jpeg,image/webp" onChange="{{setLogo}}" style="position: absolute; width: 1px; height: 1px; opacity: 0">
            </label>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="oficina" style="font-size: 12px; color: #A1A1AA">Nome da oficina</label>
            <input id="oficina" type="text" placeholder="Ex.: Oficina São José" value="{{shop.nome}}" onChange="{{setShopNome}}" style="height: 44px; padding: 0 12px; background: #3F3F46; border: 1px solid #52525B; border-radius: 10px; color: #FFFFFF">
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
            <div style="display: flex; flex-direction: column; gap: 4px">
              <label for="tel" style="font-size: 12px; color: #A1A1AA">Telefone / WhatsApp</label>
              <input id="tel" type="tel" placeholder="(00) 00000-0000" value="{{shop.tel}}" onChange="{{setShopTel}}" style="height: 44px; padding: 0 12px; background: #3F3F46; border: 1px solid #52525B; border-radius: 10px; color: #FFFFFF; min-width: 0">
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px">
              <label for="cnpj" style="font-size: 12px; color: #A1A1AA">CNPJ</label>
              <input id="cnpj" type="text" inputMode="numeric" placeholder="00.000.000/0000-00" value="{{shop.cnpj}}" onChange="{{setShopCnpj}}" style="height: 44px; padding: 0 12px; background: #3F3F46; border: 1px solid #52525B; border-radius: 10px; color: #FFFFFF; min-width: 0">
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="endereco" style="font-size: 12px; color: #A1A1AA">Endereço</label>
            <input id="endereco" type="text" placeholder="Rua, número, bairro, cidade" value="{{shop.end}}" onChange="{{setShopEnd}}" style="height: 44px; padding: 0 12px; background: #3F3F46; border: 1px solid #52525B; border-radius: 10px; color: #FFFFFF">
          </div>
        </section>

        <section style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #27272A; border-radius: 12px">
          <h2 style="margin: 0; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #A1A1AA; font-weight: 500">Preços</h2>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
            <div style="display: flex; flex-direction: column; gap: 4px">
              <label for="fator" style="font-size: 12px; color: #A1A1AA">Motos 250 cc+ (×)</label>
              <input id="fator" type="text" inputMode="decimal" value="{{fator}}" onChange="{{setFator}}" style="height: 44px; padding: 0 12px; background: #3F3F46; border: 1px solid #52525B; border-radius: 10px; color: #FFFFFF; min-width: 0">
            </div>
          </div>
          <span style="font-size: 12px; color: #A1A1AA">Ex.: 1,3 deixa a revisão de uma Lander 250 30% mais cara que a de uma Factor 150.</span>
        </section>

        <section style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #27272A; border-radius: 12px">
          <h2 style="margin: 0; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #A1A1AA; font-weight: 500">Mecânico</h2>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <label for="mecanico" style="font-size: 12px; color: #A1A1AA">Seu nome</label>
            <input id="mecanico" type="text" placeholder="Ex.: João" value="{{mecanico}}" onChange="{{setMecanico}}" style="height: 44px; padding: 0 12px; background: #3F3F46; border: 1px solid #52525B; border-radius: 10px; color: #FFFFFF">
          </div>
          <a href="login.html" style="height: 48px; display: flex; align-items: center; justify-content: center; border: 1.5px solid #FFC107; border-radius: 10px; color: #FFC107; text-decoration: none; font-weight: 500">Sair da conta</a>
        </section>

        <section style="display: flex; flex-direction: column; gap: 6px; font-size: 11px; line-height: 1.5; color: #A1A1AA">
          <h2 style="margin: 0; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #A1A1AA; font-weight: 500">Créditos das fotos</h2>
          <p style="margin: 0">Fotos dos modelos: Wikimedia Commons. MT-03: Retired electrician (CC0) · NMax: Chanokchon (CC BY-SA 4.0) · PCX 160: Ahri Boy (CC BY 4.0) · XMax 250: Firzafp (CC BY 4.0).</p>
        </section>
      </div>
    </sc-if>

      traseira: [['Lona/pastilha de freio traseira', 50, 30], ['Kit relação', 180, 50], ['Rolamentos da roda traseira', 60, 40], ['Borracha do cubo (coxim)', 40, 20]],
      km1000: [['Troca de óleo do motor', 45, 20], ['Limpeza da tela do filtro', 0, 15], ['Regulagem da corrente', 0, 20], ['Revisão de apertos', 0, 30]],
      km6000: [['Troca de óleo do motor', 45, 20], ['Filtro de óleo', 25, 5], ['Vela de ignição', 30, 10], ['Limpeza e regulagem da corrente', 0, 30], ['Regulagem de freios', 0, 20]],
      km12000: [['Troca de óleo do motor', 45, 20], ['Filtro de óleo', 25, 5], ['Filtro de ar', 40, 10], ['Vela de ignição', 30, 10], ['Fluido de freio', 30, 25], ['Regulagem de válvulas', 0, 60], ['Limpeza e regulagem da corrente', 0, 30]]
    };
  }

  // guarda as telas visitadas para o botão Voltar
  setState(change, cb) {
    if (change && change.screen && this.state && change.screen !== this.state.screen && !change.voltando) {
      change = Object.assign({}, change, { pilha: (this.state.pilha || []).concat([this.state.screen]).slice(-15) });
    }
    if (change && change.voltando) {
      change = Object.assign({}, change);
      delete change.voltando;
    }
    return super.setState(change, cb);
  }

  voltar(back) {
    const s = this.state;
    const pilha = (s.pilha || []).slice();
    let prev = pilha.pop() || back[s.screen] || 'home';
    if (s.screen === 'done' || prev === s.screen) prev = 'home';
    this.setState({ screen: prev, pilha: pilha, flash: '', voltando: true });
  }

  tplKey() { return this.state.rev === 'km' ? 'km' + this.state.km : this.state.rev; }
  key() { return this.state.modelId + ':' + this.tplKey(); }

  model() {
    const s = this.state;
    const b = this.brands[s.brand];
    return b && s.modelId ? b.models.find((m) => m[0] === s.modelId) : null;
  }

  currentItems() {
    const saved = this.state.edits[this.key()];
    if (saved) return saved;
    const m = this.model();
    const f = m && m[3] === 2 ? this.num(this.state.fator) || 1 : 1;
    return this.templates[this.tplKey()].map((t, i) => ({ id: 't' + i, name: t[0], part: String(Math.round(t[1] * f)), labor: String(Math.round(t[2] * f)), on: true }));
  }

  saveItems(list) {
    const edits = Object.assign({}, this.state.edits);
    edits[this.key()] = list;
    this.setState({ edits: edits });
  }

  patch(i, change) {
    this.saveItems(this.currentItems().map((it, j) => (j === i ? Object.assign({}, it, change) : it)));
  }

  patchStock(id, change) {
    this.setState({ stock: this.state.stock.map((sk) => (sk.id === id ? Object.assign({}, sk, change) : sk)) });
  }

  stockLevel(sk) {
    const min = this.num(sk.min);
    if (sk.qty <= Math.floor(min / 2)) return 'red';
    if (sk.qty <= min) return 'yellow';
    return 'green';
  }

  setStatus(id, novo) {
    const s = this.state;
    let used = 0;
    let stock = s.stock;
    const history = s.history.map((h) => {
      if (h.id !== id) return h;
      if (novo >= 2 && h.status < 2) {
        stock = stock.map((sk) => {
          if ((h.items || []).indexOf(sk.servico) !== -1 && sk.qty > 0) { used += 1; return Object.assign({}, sk, { qty: sk.qty - 1 }); }
          return sk;
        });
      }
      return Object.assign({}, h, { status: novo });
    });
    const msgs = ['Voltou para aguardando aprovação.', 'Marcado como aprovado.', 'Serviço iniciado.', 'Marcado como pronto.', 'Pago! Foi para o histórico.'];
    this.setState({ history: history, stock: stock, flash: msgs[novo] + (used ? ' Baixa de ' + used + (used === 1 ? ' peça' : ' peças') + ' no estoque.' : '') });
  }

  advance(id) {
    const h = this.state.history.find((x) => x.id === id);
    if (h) this.setStatus(id, Math.min(4, h.status + 1));
  }

  // dados antigos (3 etapas) para as 5 etapas novas, e lista de clientes a partir das ordens
  migrar() {
    const st = this.state;
    if (st.history.some((h) => h.sv !== 2)) {
      st.history = st.history.map((h) => {
        if (h.sv === 2) return h;
        let novo = h.status;
        if (h.status === 1) novo = 2;
        else if (h.status === 2) novo = h.entregue ? 4 : 3;
        return Object.assign({}, h, { status: novo, sv: 2 });
      });
    }
    if (!Array.isArray(st.clientes)) {
      let lista = [];
      st.history.slice().reverse().forEach((h) => { lista = this.acharOuCriarCliente(h, lista).lista; });
      st.clientes = lista;
      st.history = st.history.map((h) => (h.clienteId ? h : Object.assign({}, h, { clienteId: this.clienteDaOrdem(h, lista) })));
    }
  }

  digitos(t) { return String(t || '').replace(/\D/g, ''); }
  normNome(t) { return String(t || '').trim().toLowerCase(); }

  clienteDaOrdem(h, lista) {
    const tel = this.digitos(h.tel);
    const nome = this.normNome(h.cliente);
    const c = lista.find((x) => (tel && this.digitos(x.tel) === tel) || (nome && nome !== 'cliente sem nome' && this.normNome(x.nome) === nome));
    return c ? c.id : null;
  }

  acharOuCriarCliente(h, lista) {
    const semNome = !h.cliente || h.cliente === 'Cliente sem nome';
    const tel = this.digitos(h.tel);
    if (semNome && !tel) return { id: null, lista: lista };
    const placa = h.placa && h.placa !== 'SEM PLACA' && h.placa.charAt(0) !== '[' ? h.placa : '';
    const id = this.clienteDaOrdem(h, lista);
    if (id) {
      return { id: id, lista: lista.map((c) => (c.id !== id ? c : Object.assign({}, c, {
        tel: c.tel || h.tel || '',
        placas: placa && (c.placas || []).indexOf(placa) === -1 ? (c.placas || []).concat([placa]) : (c.placas || [])
      }))) };
    }
    const novo = { id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), nome: semNome ? 'Cliente ' + h.tel : h.cliente, tel: h.tel || '', placas: placa ? [placa] : [] };
    return { id: novo.id, lista: [novo].concat(lista) };
  }

  ordensDoCliente(c) {
    return this.state.history.filter((h) => h.clienteId === c.id || (!h.clienteId && this.clienteDaOrdem(h, [c]) === c.id));
  }

  cartaoOS(h) {
    const s = this.state;
    const nomeCli = h.cliente && h.cliente.charAt(0) !== '[' && h.cliente !== 'Cliente sem nome' ? ', ' + h.cliente.split(/\s+/)[0] : '';
    return {
      num: h.num, placa: h.placa, cliente: h.cliente, moto: h.moto, rev: h.rev, data: h.data,
      totalFmt: this.brl(h.total), status: this.statuses[h.status], statusStyle: this.pill(h.status),
      telTxt: h.tel && String(h.tel).trim() ? 'WhatsApp: ' + h.tel : 'Sem WhatsApp cadastrado',
      steps: this.statusMini.map((l, i) => ({
        label: l, atual: i === h.status ? 'true' : 'false', aria: 'Mudar para ' + this.statuses[i],
        pick: () => this.setStatus(h.id, i),
        style: 'height: 34px; padding: 0 2px; border-radius: 8px; font-size: 10px; font-weight: 600; ' + (i === h.status ? 'background: ' + this.statusColors[i][2] + '; color: ' + (i === 0 || i === 3 ? '#18181B' : '#FFFFFF') + '; border: 0' : i < h.status ? 'background: #3F3F46; color: #CFCFCF; border: 0' : 'background: transparent; color: #A1A1AA; border: 1px solid #3F3F46')
      })),
      hasNext: h.status < 4, nextLabel: this.nextLabels[h.status] || '', advance: () => this.advance(h.id),
      hasWa: h.status === 0 || h.status === 3,
      waLabel: h.status === 0 ? 'Reenviar' : 'Avisar pronta',
      wa: () => this.openWa(h.tel, h.status === 0 ? this.reenviarMsg(h) : 'Olá' + nomeCli + '! Sua ' + h.moto + ' está pronta para retirada' + (s.shop.nome.trim() ? ' na ' + s.shop.nome.trim() : '') + '. Total: ' + this.brl(h.total) + '. Qualquer dúvida, é só chamar.'),
      reabrir: () => this.setStatus(h.id, 3),
      editando: s.editOs === h.id, naoEditando: s.editOs !== h.id,
      apagando: s.delOs === h.id, mostraAcoes: s.editOs !== h.id && s.delOs !== h.id,
      pedirApagar: () => this.setState({ delOs: h.id, editOs: null }),
      cancelarApagar: () => this.setState({ delOs: null }),
      apagar: () => this.setState({ history: this.state.history.filter((x) => x.id !== h.id), delOs: null, flash: 'OS ' + h.num + ' apagada.' }),
      editar: () => this.setState({ editOs: h.id, edCli: { cliente: h.cliente === 'Cliente sem nome' ? '' : h.cliente, tel: h.tel || '', placa: h.placa === 'SEM PLACA' ? '' : h.placa } })
    };
  }

  openWa(phone, text) {
    let digits = String(phone || '').replace(/\D/g, '');
    if (digits && digits.length <= 11) digits = '55' + digits;
    window.open('https://wa.me/' + digits + '?text=' + encodeURIComponent(text), '_blank', 'noopener');
  }

  avisarMsg(h) {
    const shop = this.state.shop.nome.trim();
    const nome = h.cliente && h.cliente.charAt(0) !== '[' && h.cliente !== 'Cliente sem nome' ? ', ' + h.cliente.split(/\s+/)[0] : '';
    return 'Olá' + nome + '! Sua ' + h.moto + ' está pronta para retirada' + (shop ? ' na ' + shop : '') + '. Total: ' + this.brl(h.total) + '. Qualquer dúvida, é só chamar.';
  }

  reenviarMsg(h) {
    const shop = this.state.shop.nome.trim();
    return 'Olá! Passando para lembrar do orçamento da sua ' + h.moto + ' (' + h.rev + ')' + (shop ? ' na ' + shop : '') + ': ' + this.brl(h.total) + '.' + (h.link ? '\n\nVeja e aprove por aqui:\n' + h.link : ' Responda *SIM* para aprovar.');
  }

  loadLogo(e) {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, 300 / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * sc));
        const h = Math.max(1, Math.round(img.height * sc));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        const jpg = c.toDataURL('image/jpeg', 0.92);
        this.setState({ shop: Object.assign({}, this.state.shop, { logo: jpg, logoW: w, logoH: h }) });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
  }

  // PDF A4 feito à mão (Helvetica + logo em JPEG)
  buildPdf(h) {
    const shop = this.state.shop;
    const enc = (t) => String(t == null ? '' : t)
      .replace(/[•–—−]/g, '-').replace(/[“”]/g, '"').replace(/[‘’]/g, "'")
      .replace(/[^\x00-\xFF]/g, '?')
      .replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
    const wide = { 'M': 833, 'W': 944, 'm': 833, 'w': 722, 'O': 778, 'Ç': 722, 'Ã': 667, 'A': 667, 'R': 722, 'D': 722, 'N': 722, 'Í': 278, 'I': 278, 'i': 222, 'l': 222, 'j': 222, 't': 278, 'f': 278, 'r': 333, ' ': 278, ',': 278, '.': 278, ':': 278, '-': 333, '$': 556 };
    const tw = (t, size, bold) => {
      let w = 0;
      String(t).split('').forEach((ch) => { w += wide[ch] || (/[A-ZÀ-Ý]/.test(ch) ? 680 : 556); });
      return w * size / 1000 * (bold ? 1.05 : 1);
    };
    const T = (x, y, size, t, bold, rgb) => 'BT /' + (bold ? 'F2' : 'F1') + ' ' + size + ' Tf ' + (rgb || '0.09 0.09 0.11') + ' rg ' + x.toFixed(1) + ' ' + y + ' Td (' + enc(t) + ') Tj ET\n';
    const R = (xr, y, size, t, bold, rgb) => T(xr - tw(t, size, bold), y, size, t, bold, rgb);
    const money = (v) => this.brl(v).replace(/ /g, ' ');
    let c = '';
    c += '1 0.757 0.027 rg 0 818 595 24 re f\n';
    const hasLogo = !!shop.logo && shop.logoW > 0;
    if (hasLogo) {

        }
        return d + 'h f\n';
      };
      c += '1 0.757 0.027 rg ' + hexa(72, 760, 32);

    }
    const shopName = shop.nome.trim() || 'Minha Oficina';
    const linha2 = [shop.tel.trim(), shop.cnpj.trim() ? 'CNPJ ' + shop.cnpj.trim() : ''].filter(Boolean).join('  ·  ');
    c += T(116, 776, 16, shopName, true);
    if (linha2) c += T(116, 761, 9, linha2, false, '0.32 0.32 0.36');
    if (shop.end.trim()) c += T(116, 748, 9, shop.end.trim(), false, '0.32 0.32 0.36');

    c += '0.85 0.85 0.85 RG 1 w 40 715 m 555 715 l S\n';
    const campo = (x, y, rot, val) => T(x, y + 14, 8, rot.toUpperCase(), true, '0.45 0.45 0.48') + T(x, y, 11, val || '-');
    c += campo(40, 682, 'Cliente', h.cliente);
    c += campo(230, 682, 'WhatsApp', h.tel);
    c += campo(370, 682, 'Placa', h.placa);
    c += campo(470, 682, 'Km', h.km);
    c += campo(40, 645, 'Moto', h.moto);
    c += campo(300, 645, 'Serviço', h.rev);
    c += '1 0.757 0.027 rg 40 600 515 22 re f\n';
    c += T(48, 607, 9, 'SERVIÇO / PEÇA', true);
    c += R(390, 607, 9, 'PEÇA', true);
    c += R(470, 607, 9, 'MÃO DE OBRA', true);
    c += R(547, 607, 9, 'TOTAL', true);
    let y = 582;
    const itens = h.itemsFull || [];
    itens.forEach((it) => {
      c += T(48, y, 10, it.name);
      c += R(390, y, 10, money(it.part));
      c += R(470, y, 10, money(it.labor));
      c += R(547, y, 10, money(it.part + it.labor), true);
      c += '0.9 0.9 0.9 RG 0.5 w 40 ' + (y - 8) + ' m 555 ' + (y - 8) + ' l S\n';
      y -= 22;
    });
    y -= 10;
    c += T(360, y, 10, 'Peças', false, '0.32 0.32 0.36') + R(547, y, 10, money(h.parts));
    y -= 18;
    c += T(360, y, 10, 'Mão de obra', false, '0.32 0.32 0.36') + R(547, y, 10, money(h.labor));
    y -= 30;
    c += '0.09 0.09 0.11 rg 350 ' + (y - 9) + ' 205 30 re f\n';
    c += T(362, y, 13, 'TOTAL', true, '1 0.757 0.027') + R(545, y, 14, money(h.total), true, '1 0.757 0.027');
    c += T(40, y, 10, 'Pagamento: ' + (h.pag || '-'), false, '0.32 0.32 0.36');
    c += T(40, 64, 8, 'Orçamento sujeito à aprovação do cliente. Os valores podem mudar se outros problemas forem encontrados durante o serviço.', false, '0.45 0.45 0.48');
    c += T(40, 50, 8, 'Gerado pelo app Minha Oficina', false, '0.45 0.45 0.48');

    const objs = [];
    objs.push('<< /Type /Catalog /Pages 2 0 R >>');
    objs.push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
    objs.push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents 4 0 R /Resources << /Font << /F1 5 0 R /F2 6 0 R >>' + (hasLogo ? ' /XObject << /Im1 7 0 R >>' : '') + ' >> >>');
    objs.push('<< /Length ' + c.length + ' >>\nstream\n' + c + 'endstream');
    objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    if (hasLogo) {
      const bin = atob(shop.logo.split(',')[1]);
      objs.push('<< /Type /XObject /Subtype /Image /Width ' + shop.logoW + ' /Height ' + shop.logoH + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + bin.length + ' >>\nstream\n' + bin + '\nendstream');
    }
    let out = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';

    const xref = out.length;
    out += 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n';
    offs.forEach((o) => { out += String(o).padStart(10, '0') + ' 00000 n \n'; });
    out += 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF';
    const bytes = new Uint8Array(out.length);
    for (let k = 0; k < out.length; k++) bytes[k] = out.charCodeAt(k) & 255;
    return bytes;
  }

  async baixarPdf(h) {
    const blob = new Blob([this.buildPdf(h)], { type: 'application/pdf' });
    const filename = ('Orcamento-' + h.num + '-' + h.placa).replace(/[^A-Za-z0-9-]+/g, '-') + '.pdf';
    let dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (err) { dl = null; }
    if (dl) {
      try {
        await dl.save({ filename: filename, data: blob });
        this.setState({ pdfMsg: 'PDF salvo: ' + filename });
      } catch (err) {
        this.setState({ pdfMsg: err && err.code === 'declined' ? 'Download cancelado.' : 'Não foi possível salvar o PDF aqui.' });
      }
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    this.setState({ pdfMsg: 'PDF gerado: ' + filename });
  }

      addStock: () => { const uid = s.uid + 1; this.setState({ uid: uid, stockCat: 'Todas', stockLow: false, stockBusca: '', stock: [{ id: 'sn' + uid, name: 'Nova peça', cat: 'Outros', servico: 'Nova peça', qty: 0, min: '1', custo: '' }].concat(s.stock) }); },

      shop: s.shop,
      setShopNome: this.setShop('nome'), setShopTel: this.setShop('tel'), setShopCnpj: this.setShop('cnpj'), setShopEnd: this.setShop('end'),
      fator: s.fator, setFator: (e) => this.setState({ fator: e.target.value }),
      mecanico: s.mecanico, setMecanico: (e) => this.setState({ mecanico: e.target.value })
    };
  }
}
DC.mount(Component, document.getElementById('tela'), document.getElementById('app'), { salvarEm: "minhaOficina", campos: ["history", "osNum", "stock", "shop", "mecanico", "fator", "edits", "names", "uid", "clientes"] });
</script>
