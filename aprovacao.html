<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18181B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Aprovar orçamento</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121212}
a{color:#FFC107}a:hover{color:#FFD54F}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #FFC107;outline-offset:2px}
</style>
<style>
html, body { height: 100%; }
body { margin: 0; background: #18181B; }
#app { height: 100%; display: flex; justify-content: center; }
#app > div { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
</style>
</head>
<body>
<div id="app"></div>
<template id="tela"><div style="width: 100%; max-width: 560px; height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; background: #121212; color: #FFFFFF; font-family: 'Poppins', system-ui, sans-serif; font-size: 14px; overflow: hidden">

  <header style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 16px">
    <svg width="44" height="44" viewBox="0 0 132 132" fill="none" aria-hidden="true" style="flex-shrink: 0"><path d="M66 8l50 29v58l-50 29-50-29V37z" stroke="#FFC107" stroke-width="10" stroke-linejoin="round"></path><g stroke="#FFC107" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M82 46a10 10 0 0 0-13 13L48 80l5 5 21-21a10 10 0 0 0 13-13l-6 6-6-1-1-6z"></path></g></svg>
    <div style="display: flex; flex-direction: column; min-width: 0">
      <span style="font-weight: 600; font-size: 17px">[Nome da oficina]</span>
      <span style="font-size: 12px; color: #A3A3A3">[Telefone] · [CNPJ]</span>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 0 16px 24px">
    <sc-if value="{{pending}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; flex-direction: column; gap: 4px; padding: 16px; background: #1E1E1E; border: 1px solid #2E2E2E; border-radius: 14px">
          <span style="font-size: 13px; color: #CFCFCF">Olá, [nome do cliente]. Este é o orçamento da sua moto:</span>
          <h1 style="margin: 0; font-weight: 700; font-size: 24px; line-height: 1.2; color: #FFC107">Honda CG 160 Titan</h1>
          <span style="font-size: 12px; color: #A3A3A3">Revisão geral · placa [ABC1D23] · válido por 7 dias</span>
        </div>

        <p style="margin: 0; display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #1E1E1E; border: 1.5px solid #FFC107; border-radius: 12px; font-size: 13px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFC107" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16v.5"></path></svg>
          Aprove só o que quiser fazer agora. O total se atualiza na hora.
        </p>

        <div style="display: flex; flex-direction: column; gap: 10px">
          <sc-for list="{{items}}" as="it" hint-placeholder-count="7">
            <div style="{{it.cardStyle}}">
              <div style="display: flex; justify-content: space-between; gap: 12px">
                <span style="display: flex; flex-direction: column">
                  <span style="font-weight: 600; font-size: 14px">{{it.name}}</span>
                  <span style="font-size: 12px; color: #A3A3A3">{{it.detail}}</span>
                </span>
                <span style="font-weight: 600; white-space: nowrap">{{it.totalFmt}}</span>
              </div>
              <div role="group" aria-label="{{it.groupLabel}}" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
                <button type="button" onClick="{{it.approve}}" aria-pressed="{{it.isYes}}" style="{{it.yesStyle}}">Aprovar</button>
                <button type="button" onClick="{{it.reject}}" aria-pressed="{{it.isNo}}" style="{{it.noStyle}}">Agora não</button>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 60px 12px; text-align: center">
        <div style="width: 80px; height: 80px; border-radius: 50%; background: #FFC107; color: #1E1E1E; display: flex; align-items: center; justify-content: center">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
        </div>
        <h1 style="margin: 0; font-weight: 700; font-size: 26px; line-height: 1.2">Orçamento aprovado</h1>
        <p style="margin: 0; color: #CFCFCF">{{doneText}}</p>
        <p style="margin: 0; font-weight: 700; font-size: 36px; color: #FFC107">{{totalFmt}}</p>
        <button type="button" onClick="{{reopen}}" style="height: 48px; padding: 0 20px; background: transparent; border: 1.5px solid #FFC107; border-radius: 12px; color: #FFC107; font-weight: 500">Revisar minha escolha</button>
      </div>
    </sc-if>
  </main>

  <sc-if value="{{pending}}" hint-placeholder-val="{{ true }}">
    <footer style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 14px 16px 20px; background: #1E1E1E; border-top: 1px solid #2E2E2E">
      <div style="display: flex; flex-direction: column; flex: 1">
        <span style="font-size: 12px; color: #A3A3A3">{{countLabel}}</span>
        <span style="font-weight: 700; font-size: 24px; line-height: 1.15">{{totalFmt}}</span>
        <span style="font-size: 11px; color: #A3A3A3">Pix ou cartão em até 6x</span>
      </div>
      <button type="button" onClick="{{confirm}}" style="height: 52px; padding: 0 24px; background: #FFC107; border: 0; border-radius: 12px; color: #1E1E1E; font-weight: 600; font-size: 15px">Confirmar</button>
    </footer>
  </sc-if>
</div></template>
<script src="dc-runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.items = [['Troca de óleo do motor', 45, 20], ['Filtro de óleo', 25, 5], ['Filtro de ar', 40, 10], ['Vela de ignição', 30, 10], ['Limpeza e regulagem da corrente', 0, 30], ['Regulagem de freios', 0, 20], ['Check-up elétrico', 0, 30]];
    this.state = { yes: this.items.map(() => true), done: false };
  }
  brl(v) { return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
  set(i, val) { const yes = this.state.yes.slice(); yes[i] = val; this.setState({ yes: yes }); }
  btn(sel, primary) {
    return 'height: 44px; border-radius: 10px; font-weight: 500; font-size: 14px; ' + (sel ? (primary ? 'background: #FFC107; color: #1E1E1E; border: 1px solid #FFC107' : 'background: #3A3A3A; color: #FFFFFF; border: 1px solid #5A5A5A') : 'background: transparent; color: #CFCFCF; border: 1px solid #3A3A3A');
  }
  renderVals() {
    const s = this.state;
    const total = this.items.reduce((a, t, i) => a + (s.yes[i] ? t[1] + t[2] : 0), 0);
    const n = s.yes.filter(Boolean).length;
    return {
      pending: !s.done, done: s.done,
      items: this.items.map((t, i) => ({
        name: t[0], detail: 'Peça ' + this.brl(t[1]) + ' · M.O. ' + this.brl(t[2]), totalFmt: this.brl(t[1] + t[2]),
        groupLabel: 'Decisão para ' + t[0], isYes: s.yes[i] ? 'true' : 'false', isNo: s.yes[i] ? 'false' : 'true',
        cardStyle: 'display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #1E1E1E; border: 1px solid #2E2E2E; border-radius: 12px; ' + (s.yes[i] ? '' : 'opacity: 0.6'),
        yesStyle: this.btn(s.yes[i], true), noStyle: this.btn(!s.yes[i], false),
        approve: () => this.set(i, true), reject: () => this.set(i, false)
      })),
      countLabel: n + ' de ' + this.items.length + ' itens aprovados',
      totalFmt: this.brl(total),
      doneText: 'A oficina já foi avisada. ' + n + ' de ' + this.items.length + ' itens aprovados.',
      confirm: () => this.setState({ done: true }),
      reopen: () => this.setState({ done: false })
    };
  }
}
DC.mount(Component, document.getElementById('tela'), document.getElementById('app'), {});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
}
</script>
</body>
</html>
